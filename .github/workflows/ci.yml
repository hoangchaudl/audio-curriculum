# Every PR: type-check, unit tests, Firestore rules tests (emulator, fake
# data only) and a production build. Every merge to main: the same checks,
# then deploy hosting + Firestore rules - so the live site always matches
# main and rules are never forgotten.
#
# Deploy needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key
# of a Google service account with the "Firebase Hosting Admin" and
# "Firebase Rules Admin" roles (see README "Deploying"). Without it the
# deploy step is skipped with a warning.
name: CI / Deploy

on:
  pull_request:
  push:
    branches: [main]

# One deploy at a time; a newer merge waits instead of racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run lint
      - run: npm test
      - run: npm run test:rules
      - run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy hosting + Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set - skipping deploy. See README > Deploying."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@latest deploy --only hosting,firestore:rules --project gen-lang-client-0559782052 --non-interactive
